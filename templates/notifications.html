{% extends "base.html" %}
{% block title %}Notifications - SmartFind{% endblock %}
{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
        <h1 class="page-title">Notifications</h1>
        <form method="POST" action="/notifications/read-all">
            <button type="submit" class="btn-outline">Mark all as read</button>
        </form>
    </div>

    <div class="notif-list">
        {% for n in rows %}
            <a class="notif-item {% if not n.is_read %}unread{% endif %}" href="/notifications/{{ n.id }}/go">
                <span class="notif-dot"></span>
                <span class="notif-body">
                    <span class="notif-msg">{{ n.message }}</span>
                    <span class="meta">{{ n.created_at }}</span>
                </span>
            </a>
        {% else %}
            <p class="empty">No notifications yet.</p>
        {% endfor %}
    </div>
{% endblock %}
