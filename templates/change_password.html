{% extends "base.html" %}

{% block title %}Change password - SmartFind{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1 class="page-title">Choose your password</h1>
        <p class="subtitle">Use the temporary password you were sent as the current one.</p>

        <form method="POST">
            <label>Current (temporary) password</label>
            <input type="password" name="current" required>

            <label>New password (at least 8 characters)</label>
            <input type="password" name="new" required>

            <label>Confirm new password</label>
            <input type="password" name="confirm" required>

            <button type="submit" class="btn-full">Save password</button>
        </form>
    </div>
{% endblock %}
