{% extends "base.html" %}

{% block title %}Login - SmartFind{% endblock %}

{% block content %}
    <div class="card form-card">
        <img class="auth-banner" src="{{ url_for('static', filename='images/dsu_campus.jpg') }}" alt="Dayananda Sagar University campus" width="1140" height="327">
        <h1 class="page-title">Login</h1>
        <p class="subtitle">Welcome back.</p>

        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn-full">Login</button>
        </form>
        <p class="meta" style="margin-top: 16px;">Accounts are created by the admin. Use the email and temporary password you were sent.</p>
    </div>
{% endblock %}
