{% extends "base.html" %}

{% block title %}Report an Item - SmartFind{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1 class="page-title">Report an Item</h1>
        <p class="subtitle">Tell us what you lost, found or saw.</p>

        <form method="POST" enctype="multipart/form-data">
            <label>I have...</label>
            <select name="status" required>
                <option value="lost">Lost something</option>
                <option value="found">Found something</option>
                <option value="seen">Seen something (I don't have it)</option>
            </select>

            <label>Photo (optional, PNG/JPG/WEBP, max 20 MB)</label>
            <input type="file" name="photo" accept="image/*">

            <label>Item name</label>
            <input type="text" name="title" placeholder="e.g. Blue water bottle" required>

            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Colour, brand, marks, anything that helps identify it"></textarea>

            <label>Category</label>
            <select name="category">
                <option>Wallet</option>
                <option>Bottle</option>
                <option>Electronics</option>
                <option>Books</option>
                <option>ID Card</option>
                <option>Keys</option>
                <option>Clothing</option>
                <option>Other</option>
            </select>

                        <label>Where?</label>
            <input type="text" name="place" list="place-options" placeholder="Pick from the list or type your own" required>
            <datalist id="place-options">
                <option value="Library">
                <option value="Mess">
                <option value="Canteen">
                <option value="Cricket Ground">
                <option value="Parking">
                <option value="Classroom">
                <option value="Lecture Hall">
                <option value="Lab">
                <option value="Professor Cabin">
                <option value="Auditorium">
                <option value="Sports Complex">
                <option value="Bus Stop">
                <option value="Academic Block">
                <option value="Hostel">
            </datalist>

            <label>Place details (optional)</label>
            <input type="text" name="place_details" placeholder="e.g. Room 204, near the pavilion, bike row B">

            <label>Date (optional)</label>
            <input type="date" name="event_date">

            <label>Approximate time (optional)</label>
            <input type="time" name="event_time">

            <button type="submit" class="btn-full">Submit</button>
        </form>
    </div>
{% endblock %}
