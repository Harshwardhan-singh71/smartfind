{% extends "base.html" %}

{% block title %}Login - SmartFind{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1 class="page-title">Login</h1>
        <p class="subtitle">Welcome back.</p>

        <form method="POST">
            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit" class="btn-full">Login</button>
        </form>
        <p class="meta" style="margin-top: 16px;">Accounts are created by the admin. Use the email and temporary password you were sent.</p>
    </div>
{% endblock %}
