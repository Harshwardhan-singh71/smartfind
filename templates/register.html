{% extends "base.html" %}

{% block title %}Register - SmartFind{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1 class="page-title">Create an account</h1>
        <p class="subtitle">So people can reach you when an item is found.</p>

        <form method="POST">
            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="At least 6 characters" required>

            <button type="submit" class="btn-full">Create account</button>
        </form>
        <p class="meta" style="margin-top: 16px;">Already registered? <a href="/login">Login</a></p>
    </div>
{% endblock %}
