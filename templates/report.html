{% extends "base.html" %}

{% block title %}Report an Item - SmartFind{% endblock %}

{% block content %}
    <div class="card form-card">
        <h1 class="page-title">Report an Item</h1>
        <p class="subtitle">Tell us what you lost or found.</p>

        <form method="POST">
            <label>I have...</label>
            <select name="status" required>
                <option value="lost">Lost something</option>
                <option value="found">Found something</option>
            </select>

            <label>Item name</label>
            <input type="text" name="title" placeholder="e.g. Blue water bottle" required>

            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Colour, brand, marks, anything that helps identify it"></textarea>

            <label>Category</label>
            <select name="category">
                <option>Wallet</option>
                <option>Bottle</option>
                <option>Electronics</option>
                <option>Books</option>
                <option>ID Card</option>
                <option>Keys</option>
                <option>Clothing</option>
                <option>Other</option>
            </select>

            <label>Location</label>
            <input type="text" name="location" placeholder="e.g. Library, Block 2 Room 204" required>

            <button type="submit" class="btn-full">Submit</button>
        </form>
    </div>
{% endblock %}
